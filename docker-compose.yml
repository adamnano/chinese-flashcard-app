version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flashcard
      POSTGRES_PASSWORD: flashcard
      POSTGRES_DB: flashcards
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcard -d flashcards"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
